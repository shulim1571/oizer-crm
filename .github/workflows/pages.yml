# Publishes the app to GitHub Pages. Run it manually from the Actions tab once Pages is enabled
# (Settings → Pages → Source: GitHub Actions). Private repos need a paid GitHub plan for Pages.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://poymxghhjisendozqgkm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_deHBO_6wJSzo2sAVwTU6AQ_p6XJoSIQ
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
