name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Publishable key: safe in the browser; data is protected by row-level security. Set for the whole job:
    # tests that load the Supabase client need them as much as the build does.
    env:
      VITE_SUPABASE_URL: https://wwaknikpdquwnphhwzsm.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_0hWyFay7_Y_HwXdZQ2GnlQ__Z3gX5GH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
