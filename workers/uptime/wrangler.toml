# Independent uptime monitoring and status page for Oizer DRM. Free on the Workers Free plan:
# one cron trigger, and about 576 KV writes a day (the free allowance is 1,000).
#
# First deploy (needs a Cloudflare token with Workers Scripts and Workers KV Storage edit):
#   npx wrangler kv namespace create oizer-status      -> put its id below (done: oizer-status)
#   npx wrangler secret put SUPABASE_ANON_KEY            (the project's anon key; lets the health checks through the API gateway)
#   npx wrangler deploy
# Email alerts go to ALERT_EMAIL through the platform's SendGrid account (decided 2026-11-09):
#   npx wrangler secret put SENDGRID_KEY --config workers/uptime/wrangler.toml   (the platform SENDGRID_API_KEY)
#   ALERT_FROM is on mail.trubase.org, which is verified in that SendGrid account.

name = "oizer-status"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATUS"
id = "446ba1c360074ae1b5a82c206691464f"

[vars]
TITLE = "Oizer status"
SUPABASE_URL = "https://wwaknikpdquwnphhwzsm.supabase.co"
APP_URLS = "https://oizer.trubase.org/,https://oizer-drm.pages.dev/"
ALERT_EMAIL = "smueller@trubase.org"
ALERT_FROM = "status@mail.trubase.org"
