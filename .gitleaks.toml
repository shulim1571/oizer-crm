# Secret scanning (gitleaks), run in .github/workflows/security.yml over the whole history.
# Default rules, plus one exception: Supabase publishable keys are made to be public (data is protected by
# row-level security), so they may appear in client configuration. Test fixtures are pinned one by one in
# .gitleaksignore, so a real secret added to a test still fails.
title = "Donor Base"

[extend]
useDefault = true

[[allowlists]]
description = "Supabase publishable (browser) keys"
regexTarget = "match"
regexes = ['''sb_publishable_[A-Za-z0-9_\-]+''']
